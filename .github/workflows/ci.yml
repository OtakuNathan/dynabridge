name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build-type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FF for async integration tests
        uses: actions/checkout@v4
        with:
          repository: OtakuNathan/flux_foundry
          ref: 98d73c280667226f0fbb6f4408626ab875e2bd2a
          path: build-deps/flux_foundry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show tool versions
        run: |
          cmake --version
          python --version
          node --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DPORTAL_BUILD_BENCHMARKS=ON
          -DPORTAL_BUILD_EXAMPLES=ON
          -DFLUX_FOUNDRY_INCLUDE_DIR="${{ github.workspace }}/build-deps/flux_foundry"
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel 2

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build-type }} --output-on-failure

      - name: Install
        run: >
          cmake --install build
          --config ${{ matrix.build-type }}
          --prefix "${{ runner.temp }}/portal-install"

      - name: Configure package consumer
        run: >
          cmake -S tests/package_consumer -B consumer-build
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/portal-install"

      - name: Build package consumer
        run: cmake --build consumer-build --config ${{ matrix.build-type }} --parallel 2

  valgrind:
    name: ubuntu-latest / valgrind
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build
        run: cmake --build build --parallel 2

      # ctest has no built-in valgrind mode; discover native test executables
      # from the ctest registry (test commands ending in _test) and run each
      # under valgrind. Interpreter-driven smoke tests (python/node) are
      # excluded automatically: their test command is the interpreter itself.
      - name: Valgrind native tests
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            ctest --test-dir build -N -V 2>/dev/null |
              grep -oP 'Test command: \K\S+' |
              grep -E '_test$' |
              sort -u
          )
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No native test executables found" >&2
            exit 1
          fi
          echo "Valgrind targets: ${tests[*]}"
          for t in "${tests[@]}"; do
            echo "::group::valgrind $(basename "$t")"
            valgrind --error-exitcode=99 --track-origins=yes --leak-check=full \
              --show-leak-kinds=definite --errors-for-leak-kinds=definite "$t"
            echo "::endgroup::"
          done
